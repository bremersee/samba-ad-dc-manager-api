        membersToRemove:
          type: array
          items:
            type: string
          uniqueItems: true
    DnsZone:
      type: object
      description: DNS zone.
      properties:
        shutdown:
          type: boolean
        modified:
          type: string
          format: date-time
          description: The last modification date.
        created:
          type: string
          format: date-time
          description: The creation date.
        reverseZone:
