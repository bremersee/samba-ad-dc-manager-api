components:
  schemas:
    Handler:
      type: object
      description: The handler where the exception occurred.
      properties:
        className:
          type: string
          description: The class name of the handler.
        methodName:
          type: string
          description: The method name of the handler.
        methodParameterTypes:
          type: array
          description: The method parameters.
          items:
            type: string
    RestApiException:
      type: object
      description: The serialized exception.
      properties:
        id:
          type: string
          description: The id of the exception.
        timestamp:
          type: string
          format: date-time
          description: The timestamp.
        status:
          type: integer
          format: int32
          description: The http status code.
        error:
          type: string
          description: The http error message.
        errorCode:
          type: string
          description: A service specific error code.
        errorCodeInherited:
          type: boolean
          description: Determines whether the error code is inherited from the cause
            or not.
        message:
          type: string
          description: A human-readable exception message.
        exception:
          type: string
          description: The class name of the exception.
        application:
          type: string
          description: The name of the application.
        path:
          type: string
          description: The request path.
        handler:
          $ref: "#/components/schemas/Handler"
          description: The handler.
        stackTrace:
          type: array
          description: The stack trace.
          items:
            $ref: "#/components/schemas/StackTraceItem"
        cause:
          $ref: "#/components/schemas/RestApiException"
          description: The cause.
    StackTraceItem:
      type: object
      description: A stack trace element of an exception.
      properties:
        declaringClass:
          type: string
          description: The declaring class.
        methodName:
          type: string
          description: The method name.
        fileName:
          type: string
          description: The file name.
        lineNumber:
          type: integer
          format: int32
          description: The line number.
    DomainUser:
      type: object
      description: The domain user.
      properties:
        title:
          type: string
        homeDirectory:
          type: string
        email:
          type: string
        modified:
          type: string
          format: date-time
          description: The last modification date.
        uid:
          type: string
        userPrincipalName:
          type: string
        unixHomeDirectory:
          type: string
        passwordLastSet:
          type: string
          format: date-time
        company:
          type: string
        department:
          type: string
        gecos:
          type: string
        loginShell:
          type: string
        nisDomain:
          type: string
        physicalDeliveryOfficeName:
          type: string
        profilePath:
          type: string
        scriptPath:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        gidNumber:
          type: integer
          format: int32
        created:
          type: string
          format: date-time
          description: The creation date.
        sid:
          $ref: "#/components/schemas/Sid"
          description: The SID of the sam account.
        uidNumber:
          type: integer
          format: int32
        accountExpires:
          type: string
          format: date-time
        homeDrive:
          type: string
        mobile:
          type: string
        telephoneNumber:
          type: string
        logonCount:
          type: integer
          format: int32
        lastLogon:
          type: string
          format: date-time
        initials:
          type: string
        displayName:
          type: string
        description:
          type: string
        memberships:
          type: array
          items:
            type: string
        distinguishedName:
          type: string
          description: The distinguished name.
        primaryGroupId:
          type: integer
          format: int32
          description: The primary group ID of the user.
        preferredLanguage:
          type: string
          default: de-DE
          description: User's preferred language. ISO 639-1 language codes. The combinations
            like de-DE and en-US with ISO-639 and ISO-3166 also work.
        accountControl:
          $ref: "#/components/schemas/DomainUserAccountControl"
          description: User's account control.
        samAccountName:
          type: string
          description: The unique name of the sam account.
        criticalSystemObject:
          type: boolean
          default: false
          description: Determines whether this sam account is a critical system object
            or not.
      required:
      - accountControl
      - samAccountName
    DomainUserAccountControl:
      type: object
      description: Domain user's account control.
      properties:
        normalAccount:
          type: boolean
          default: true
          description: Specifies whether the account of the domain user is a normal
            one or not.
        passwordExpirationEnabled:
          type: boolean
          default: false
          description: Specifies whether the password expiration is enabled or not.
        enabled:
          type: boolean
          default: true
          description: Specifies whether the domain user is enabled or not.
    Sid:
      type: object
      description: The SID of the entity.
      properties:
        value:
          type: string
          description: The SID of the entity.
        systemEntity:
          type: boolean
          default: false
          description: Determines whether this SID belongs to a system entity or not.
          readOnly: true
      required:
      - value
    OrganizationalUnit:
      type: object
      description: The organizational unit in an active directory.
      properties:
        modified:
          type: string
          format: date-time
          description: The last modification date.
        created:
          type: string
          format: date-time
          description: The creation date.
        description:
          type: string
        distinguishedName:
          type: string
          description: The distinguished name.
        systemOu:
          type: boolean
          default: false
          description: Determines whether this organizational unit is a system one
            or not.
        name:
          type: string
          description: The name of this organizational unit.
      required:
      - name
    DomainGroup:
      type: object
      description: The domain group.
      properties:
        members:
          type: array
          description: The members of the domain group.
          items:
            type: string
        email:
          type: string
          description: The email address of the domain group.
        modified:
          type: string
          format: date-time
          description: The last modification date.
        nisDomain:
          type: string
          description: Group's Unix/RFC2307 NIS domain.
        gidNumber:
          type: integer
          format: int32
          description: Group's Unix/RFC2307 GID number.
        created:
          type: string
          format: date-time
          description: The creation date.
        description:
          type: string
          description: The description of the domain group.
        memberships:
          type: array
          items:
            type: string
        sid:
          $ref: "#/components/schemas/Sid"
          description: The SID of the sam account.
        distinguishedName:
          type: string
          description: The distinguished name.
        groupType:
          $ref: "#/components/schemas/DomainGroupType"
          description: The type of the domain group.
        groupId:
          type: integer
          format: int32
          description: The group id of this domain group.
          readOnly: true
        samAccountName:
          type: string
          description: The unique name of the sam account.
        criticalSystemObject:
          type: boolean
          default: false
          description: Determines whether this sam account is a critical system object
            or not.
      required:
      - samAccountName
    DomainGroupType:
      type: object
      description: The domain group type.
      properties:
        purpose:
          type: string
          description: The purpose of the group.
          enum:
          - Unknown
          - Security
          - Distribution
          readOnly: true
        value:
          type: integer
          format: int32
          default: -2147483646
          description: The integer value of the group type.
        scope:
          type: string
          description: The scope of the group.
          enum:
          - Unknown
          - Universal
          - Global
          - Domain
          readOnly: true
