openapi: 3.1.0
info:
  title: Samba AD DC Manager API
  description: RESTful service for Samba AD DC Manager.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 3.0.0-SNAPSHOT
  summary: The Samba AD DC Manager API
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: ad-entry-manager
  description: RESTful api for ad entries.
- name: ad-domain-manager
  description: RESTful api for domain.
- name: ad-organizational-unit-manager
  description: RESTful api for organizational units.
- name: ad-dns-manager
  description: RESTful api for dns.
- name: ad-group-manager
  description: RESTful api for groups.
- name: ad-user-avatar-manager
  description: RESTful api for user avatars.
- name: ad-computer-manager
  description: RESTful api for computers.
- name: ad-user-manager
  description: RESTful api for users.
- name: ad-managers-features-api
  description: RESTful api to obtain features of manager application.
paths:
  /api/users:
    get:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Get user page.
      operationId: getUsers
      parameters:
      - name: q
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: ou
        in: query
        description: The search base (organizational unit) like 'CN=Users'.
        required: false
        schema:
          type: string
      - name: scope
        in: query
        description: The search scope (one-level|subtree).
        required: false
        schema:
          $ref: "#/components/schemas/TreeSearchScope"
          example: subtree
      - name: page
        in: query
        description: Zero-based page index (0..N)
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        schema:
          type: integer
          default: 20
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainUserPage"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
      security:
      - bearer-jwt: []
      - basic-auth: []
    put:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Add user.
      operationId: addUser
      parameters:
      - name: pwd
        in: query
        description: The password of the user.
        required: false
        schema:
          type: string
      - name: ou
        in: query
        description: Add user to organizational unit (like 'CN=Users').
        required: false
        schema:
          type: string
      - name: username-as-cn
        in: query
        description: Specifies whether the username should be used as common name
          or not.
        required: false
        schema:
          type: boolean
      - name: invitation-email
        in: query
        description: Specifies whether an invitation email should be sent or not.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainUser"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
      security:
      - bearer-jwt: []
      - basic-auth: []
  /api/users/{name}:
    get:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Get user.
      operationId: getUser
      parameters:
      - name: name
        in: path
        description: The name of the user.
        required: true
        schema:
          type: string
      - name: id-type
        in: query
        description: The type of the given name (name|principal|uid|uid-number).
        required: false
        schema:
          $ref: "#/components/schemas/DomainUserIdentifier"
          default: name
          example: name
      - name: ou
        in: query
        description: The search base (organizational unit) like 'CN=Users'.
        required: false
        schema:
          type: string
      - name: scope
        in: query
        description: The search scope (one-level|subtree).
        required: false
        schema:
          $ref: "#/components/schemas/TreeSearchScope"
          example: subtree
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainUser"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
      security:
      - bearer-jwt: []
      - basic-auth: []
    put:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Update user.
      operationId: updateUser
      parameters:
      - name: name
        in: path
        description: The name of the user.
        required: true
        schema:
          type: string
      - name: move-to
        in: query
        description: "The new organizational unit of the user like 'CN=Users,CN=Marketing'."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainUser"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
      security:
      - bearer-jwt: []
      - basic-auth: []
    delete:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Delete user.
      operationId: deleteUser
      parameters:
      - name: name
        in: path
        description: The name of the user.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
      security:
      - bearer-jwt: []
      - basic-auth: []
  /api/users/{name}/pwd:
    put:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Update user password.
      operationId: updateUserPassword
      parameters:
      - name: name
        in: path
        description: The name of the user.
        required: true
        schema:
          type: string
      - name: invitation-email
        in: query
        description: Specifies whether an invitation email should be sent or not.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              description: "The clear password of the user. If it is empty or null,\
                \ a random password will be generated."
              example: voF7J!0$kPsfk$fz
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
      security:
      - bearer-jwt: []
      - basic-auth: []
  /api/users/{name}/avatar:
    get:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Get user avatar.
      operationId: getUserAvatar
      parameters:
      - name: name
        in: path
        description: The name of the user.
        required: true
        schema:
          type: string
      - name: d
        in: query
        description: Specifies the default avatar.
        required: false
        schema:
          $ref: "#/components/schemas/AvatarDefault"
          default: "404"
          example: mp
      - name: s
        in: query
        description: Specifies the size of the avatar.
        required: false
        schema:
          type: integer
          format: int32
          default: 80
          example: 120
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: byte
        "400":
          description: Bad request
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "404":
          description: Not found
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/RestApiException"
    put:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Update user avatar.
      operationId: updateUserAvatar
      parameters:
      - name: name
        in: path
        description: The name of the user.
        required: true
        schema:
          type: string
      requestBody:
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              description: The avatar as jpeg.
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
      security:
      - bearer-jwt: []
      - basic-auth: []
    delete:
      tags:
      - ad-user-manager
      - ad-user-avatar-manager
      description: Remove user avatar.
      operationId: removeUserAvatar
      parameters:
      - name: name
        in: path
        description: The name of the user.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestApiException"
        "404":
          description: Not found
          content:
            application/json:
